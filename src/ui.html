<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Triage des entrées en relation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fbfaf7'/%3E%3Crect x='2' y='4' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='7' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='11' width='12' height='2' fill='%23111'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/registre.css" />
</head>
<body>
<main>
  <div class="haut">
    <div>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="lang">
      <button id="fr" type="button">FR</button><button id="en" type="button">EN</button>
    </div>
  </div>

  <div id="chiffres"></div>
  <div id="reglages"></div>

  <h2 id="titreCompromis"></h2>
  <div id="compromis"></div>

  <h2 id="titreFile"></h2>
  <div id="file"></div>

  <h2 id="titreTraitees"></h2>
  <div id="traitees"></div>
</main>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = async (chemin, corps) => {
  const r = await fetch(chemin, corps ? { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(corps) } : {});
  return r.json();
};

/**
 * Les deux langues dans un seul dictionnaire.
 *
 * L'outil est une pièce de portfolio montrée à des interlocuteurs anglophones, et le
 * README est en anglais. Une interface uniquement française annulait le bénéfice.
 */
const T = {
  fr: {
    h1: "Triage des entrées en relation",
    lede: "L'agent applique la procédure sur chaque dossier, cite la clause qui fonde sa décision, et s'arrête quand il n'est pas sûr. Ce qui reste ci-dessous est ce qu'il n'a pas voulu trancher seul.",
    releve: "Relevé du portefeuille",
    auto: "traité sans humain", enFile: "dans la file",
    evitables: "escalades évitables", manquements: "manquements",
    justesse: "justesse en automatique", accord: "l'humain confirme l'agent",
    accordAttente: (n) => `${n} décision(s) avant de pouvoir conclure`,

    seuilTitre: "Jusqu'où l'agent décide seul",
    seuilQuoi: "En dessous de cette confiance, il passe la main plutôt que de trancher. Ce réglage appartient au métier, pas à qui écrit le code.",
    seuilBas: "laisse passer, quitte à se tromper", seuilHaut: "ne décide que s'il est sûr",
    seuilNom: "Seuil de confiance en dessous duquel l'agent passe la main",
    attribution: (regle, seuil) =>
      `Sur les escalades actuelles, <b>${regle}</b> viennent d'une règle qui en est sûre — le curseur ne les déplacera pas. Seules <b>${seuil}</b> dépendent de ce réglage.`,
    refLabel: "Donner à l'agent les volumes habituels par secteur — sans eux, il envoie chez un analyste des dossiers parfaitement ordinaires",

    compromisTitre: "Ce que coûte chaque réglage",
    compromisQuoi: "Mesuré sur les 400 dossiers. Un manquement est une entrée en relation non contrôlée ; une escalade évitable est du temps analyste dépensé pour rien.",
    colSeuil: "seuil", colAuto: "automatisé", colJuste: "justesse",
    colManq: "manquements", colEvit: "escalades évitables",
    avecRef: "avec référentiel sectoriel", sansRef: "sans référentiel",

    fileTitre: (n) => `File de revue — ${n} dossier${n > 1 ? "s" : ""}`,
    filePartielle: (m, n) => `File de revue — ${m} affichés sur ${n}`,
    fileVide: "Rien à revoir. À ce réglage, l'agent tranche tout seul.",
    legende: "Le point « · » marque la décision que l'agent proposait. Aucune action n'est présélectionnée : c'est toi qui tranches.",
    parLaRegle: "Escaladé par la règle elle-même — l'agent est sûr que ce dossier relève d'un analyste.",
    sousLeSeuil: (c, s) => `Confiance ${c.toFixed(2)} sous le seuil ${s.toFixed(2)} — décision laissée à un analyste`,
    aucuneRegle: "Aucune règle déclenchée — la décision reposerait sur une absence de motif.",
    motifChamp: "Motif de ta décision (facultatif)",
    proposeTitre: "Ce que l'agent proposait",
    nettete: "netteté", confiance: "confiance", declares: "déclarés", opere: "opère vers",

    traiteesTitre: "Décisions humaines récentes",
    traiteesVide: "Aucune décision humaine pour l'instant.",
    proposait: "l'agent proposait :",
    remise: "Vider les décisions enregistrées",
    remiseConfirme: "Effacer toutes les décisions humaines enregistrées ?",

    approuver: "Approuver", complement: "Demander un complément", escalader: "Escalader à la conformité",
  },
  en: {
    h1: "Onboarding triage",
    lede: "The agent applies the procedure to each file, cites the clause behind its decision, and stops when it isn't confident. What's left below is what it wouldn't decide alone.",
    releve: "Portfolio statement",
    auto: "handled without a human", enFile: "in the queue",
    evitables: "avoidable escalations", manquements: "breaches",
    justesse: "correct when automatic", accord: "human agrees with the agent",
    accordAttente: (n) => `${n} more decision(s) before this means anything`,

    seuilTitre: "How far the agent decides alone",
    seuilQuoi: "Below this confidence it hands the file over instead of deciding. This setting belongs to the business, not to whoever writes the code.",
    seuilBas: "decides often, even when wrong", seuilHaut: "decides only when confident",
    seuilNom: "Confidence bar below which the agent hands over",
    attribution: (regle, seuil) =>
      `Of the current escalations, <b>${regle}</b> come from a rule that is certain — the slider won't move those. Only <b>${seuil}</b> depend on this setting.`,
    refLabel: "Give the agent the usual volumes per sector — without them it sends perfectly ordinary files to an analyst",

    compromisTitre: "What each setting costs",
    compromisQuoi: "Measured over the 400 files. A breach is an uncontrolled onboarding; an avoidable escalation is analyst time spent for nothing.",
    colSeuil: "bar", colAuto: "automated", colJuste: "correct",
    colManq: "breaches", colEvit: "avoidable escalations",
    avecRef: "with sector reference", sansRef: "without sector reference",

    fileTitre: (n) => `Review queue — ${n} file${n > 1 ? "s" : ""}`,
    filePartielle: (m, n) => `Review queue — showing ${m} of ${n}`,
    fileVide: "Nothing to review. At this setting the agent decides everything itself.",
    legende: "The “·” marks what the agent proposed. No action is preselected — the call is yours.",
    parLaRegle: "Escalated by the rule itself — the agent is certain this file belongs with an analyst.",
    sousLeSeuil: (c, s) => `Confidence ${c.toFixed(2)} below the ${s.toFixed(2)} bar — decision left to an analyst`,
    aucuneRegle: "No rule fired — the decision would rest on an absence of grounds.",
    motifChamp: "Reason for your decision (optional)",
    proposeTitre: "What the agent proposed",
    nettete: "sharpness", confiance: "confidence", declares: "declared", opere: "operates in",

    traiteesTitre: "Recent human decisions",
    traiteesVide: "No human decision yet.",
    proposait: "the agent proposed:",
    remise: "Clear recorded decisions",
    remiseConfirme: "Erase every recorded human decision?",

    approuver: "Approve", complement: "Request more information", escalader: "Escalate to compliance",
  },
};

/**
 * Les valeurs du modèle, rendues lisibles.
 *
 * « particulier » et « conseil » sont des identifiants, pas de l'anglais. Les laisser
 * traverser l'écran anglais faisait passer une donnée pour un oubli de traduction.
 */
const MOTS = {
  fr: { particulier:"particulier", societe:"société",
        "conseil":"conseil", "commerce de detail":"commerce de détail",
        "restauration":"restauration", "immobilier":"immobilier",
        "crypto-actifs":"crypto-actifs", "import-export":"import-export",
        "art et antiquites":"art et antiquités",
        identite:"pièce d'identité", domicile:"justificatif de domicile",
        immatriculation:"immatriculation", structure:"structure de détention" },
  en: { particulier:"individual", societe:"company",
        "conseil":"consulting", "commerce de detail":"retail",
        "restauration":"food service", "immobilier":"real estate",
        "crypto-actifs":"crypto assets", "import-export":"import-export",
        "art et antiquites":"art and antiques",
        identite:"identity document", domicile:"proof of address",
        immatriculation:"registration", structure:"ownership structure" },
};
const mot = (cle) => MOTS[langue][cle] ?? cle;

let langue = localStorage.getItem("langue") === "en" ? "en" : "fr";
const t = () => T[langue];

let etat = null;
let compromis = null;
let occupe = false;

const pc = (x) => (x * 100).toFixed(1) + " %";

function blocChiffres(c) {
  const L = t();
  const cases = [
    { v: pc(c.tauxAutomatisation), l: L.auto },
    { v: c.enFile, l: L.enFile },
    { v: c.escaladesInutiles, l: L.evitables },
    { v: c.manquements, l: L.manquements, alerte: c.manquements > 0 },
    { v: pc(c.precisionAutomatisee), l: L.justesse },
  ];
  // Un taux d'accord sur deux décisions n'est pas un taux, c'est du bruit. On dit
  // combien il en manque plutôt que d'afficher un chiffre qui trompe.
  cases.push(c.assezDeReprises
    ? { v: pc(c.tauxAccord), l: L.accord }
    : { v: "—", l: L.accordAttente(c.manquePourConclure), attente: true });

  /*
   * Un compte, pas des tuiles.
   *
   * Le manquement est le total : il découle de ce qui est au-dessus de lui, et une
   * tuile posée à côté des autres ne disait pas cela.
   */
  /*
   * Le total est le manquement, pas la dernière tuile venue.
   *
   * Une première version plaçait en total « il manque 9 décisions pour conclure » : une
   * réserve, pas une conclusion. Le total doit être ce qui décide — ici le seul chiffre
   * dont le coût est réglementaire.
   */
  const accord = cases.pop();
  const manquements = cases.splice(3, 1)[0];

  $("#chiffres").innerHTML = `<section class="feuillet">
    <div class="intitule">${esc(L.releve)}</div>
    <div class="corps">
      ${cases.map((x) => `<div class="ligne">
        <span class="intitule">${esc(x.l)}</span>
        <span class="valeur">${esc(x.v)}</span></div>`).join("")}
      <div class="ligne total ${c.manquements > 0 ? "defavorable" : "favorable"}">
        <span class="intitule">${esc(manquements.l)}</span>
        <span class="valeur">${esc(manquements.v)}</span></div>
      <div class="renvoi">${esc(accord.l)}${accord.attente ? "" : ` — ${esc(accord.v)}`}</div>
    </div></section>`;
}

function blocReglages(c) {
  const L = t();
  $("#reglages").innerHTML = `
    <section class="feuillet"><div class="corps">
      <div class="titre">${esc(L.seuilTitre)}</div>
      <div class="quoi">${esc(L.seuilQuoi)}</div>
      <div class="rang">
        <span class="bout">${esc(L.seuilBas)}</span>
        <input type="range" id="seuil" min="0.3" max="0.99" step="0.01" value="${c.seuil}"
          aria-label="${esc(L.seuilNom)}" />
        <span class="bout">${esc(L.seuilHaut)}</span>
        <span class="lecture" id="seuilVal">${c.seuil.toFixed(2)}</span>
      </div>
      <div class="attribution">${L.attribution(c.parLaRegle, c.parLeSeuil)}</div>
      <div class="bascule">
        <input type="checkbox" id="ref" ${c.referentielActif ? "checked" : ""} />
        <label for="ref">${esc(L.refLabel)}</label>
      </div>
    </div></section>`;

  const seuil = $("#seuil");
  seuil.oninput = () => { $("#seuilVal").textContent = Number(seuil.value).toFixed(2); };
  seuil.onchange = () => envoyer("/api/seuil", { seuil: Number(seuil.value) });
  $("#ref").onchange = (e) => envoyer("/api/referentiel", { actif: e.target.checked });
}

function blocCompromis(c) {
  const L = t();
  if (!compromis) { $("#compromis").innerHTML = ""; return; }
  const jeu = c.referentielActif ? compromis.avec : compromis.sans;

  const lignes = jeu.map((b) => {
    const ici = Math.abs(b.seuil - c.seuil) < 0.005;
    return `<tr class="${ici ? "ici" : ""}">
      <td>${b.seuil.toFixed(2)}</td>
      <td>${pc(b.tauxAutomatisation)}</td>
      <td>${pc(b.precisionAutomatisee)}</td>
      <td>${b.manquements}</td>
      <td>${b.escaladesInutiles}</td>
    </tr>`;
  }).join("");

  $("#compromis").innerHTML = `
    <div class="feuillet">
      <div class="quoi">${esc(L.compromisQuoi)}
        — <em>${esc(c.referentielActif ? L.avecRef : L.sansRef)}</em></div>
      <div class="defile">
        <table >
          <thead><tr>
            <th>${esc(L.colSeuil)}</th><th>${esc(L.colAuto)}</th><th>${esc(L.colJuste)}</th>
            <th>${esc(L.colManq)}</th><th>${esc(L.colEvit)}</th>
          </tr></thead>
          <tbody>${lignes}</tbody>
        </table>
      </div>
    </div>`;
}

function blocRegles(regles) {
  const L = t();
  if (regles.length === 0) {
    return `<div class="regle"><div class="constat" style="color:var(--muted)">${esc(L.aucuneRegle)}</div></div>`;
  }
  return regles.map((r) => `
    <div class="ligne">
      <span class="intitule"><span class="reference">${esc(r.code)}</span> ${esc(r.constat[langue])}
        <small>${esc(r.clause[langue])}</small></span>
      <span class="valeur">${r.nettete.toFixed(2)} <small>${esc(L.nettete)}</small></span>
    </div>`).join("");
}

function dossier(l) {
  const L = t();
  const c = l.cas, v = l.verdict;
  const langNum = langue === "fr" ? "fr-FR" : "en-GB";
  return `
    <div class="feuillet dossier" data-cas="${esc(c.id)}">
      <div class="corps"><div class="entete">
        <div><span class="nom">${esc(c.nom)}</span>
          <span class="meta"> · ${esc(mot(c.type))} · ${esc(c.paysResidence)}</span></div>
        <div class="meta">${esc(c.id)} · ${esc(L.confiance)} ${v.confiance.toFixed(2)}</div>
      </div>
      <div class="meta">${esc(mot(c.activite.secteur))} · ${c.activite.volumeAnnuelDeclare.toLocaleString(langNum)} € ${esc(L.declares)} · ${esc(L.opere)} ${esc(c.activite.paysOperation.join(", "))}</div>

      <div class="renvoi attention">${esc(v.escalade
        ? L.sousLeSeuil(v.motifEscalade.confiance, v.motifEscalade.seuil)
        : L.parLaRegle)}</div>
      <div style="margin-top:12px">${blocRegles(v.regles)}</div>

      <div class="rang">
        <input class="champ" placeholder="${esc(L.motifChamp)}" />
        ${["approuver", "complement", "escalader"].map((d) => `
          <button type="button" class="b${d === v.decisionBrute ? " propose" : ""}" data-d="${d}"
            ${d === v.decisionBrute ? `title="${esc(L.proposeTitre)}"` : ""}>${esc(L[d])}${d === v.decisionBrute ? " ·" : ""}</button>`).join("")}
      </div>
    </div></div>`;
}

function dessiner() {
  const L = t();
  const { chiffres: c, file, traitees } = etat;

  document.documentElement.lang = langue;
  $("#h1").textContent = L.h1;
  $("#lede").textContent = L.lede;
  $("#fr").className = langue === "fr" ? "on" : "";
  $("#en").className = langue === "en" ? "on" : "";

  blocChiffres(c);
  blocReglages(c);
  $("#titreCompromis").textContent = L.compromisTitre;
  blocCompromis(c);

  $("#titreFile").textContent = file.length < c.enFile
    ? L.filePartielle(file.length, c.enFile) : L.fileTitre(c.enFile);
  $("#file").innerHTML = file.length === 0
    ? `<div class="vide">${esc(L.fileVide)}</div>`
    : file.map(dossier).join("") + `<div class="meta" style="margin-top:10px">${esc(L.legende)}</div>`;

  $("#titreTraitees").textContent = L.traiteesTitre;
  $("#traitees").innerHTML = traitees.length === 0
    ? `<div class="vide">${esc(L.traiteesVide)}</div>`
    : traitees.map((l) => {
        const r = l.reprise;
        const accord = r.retenue === r.propose;
        return `<div class="fait">
          <div>${esc(l.cas.nom)} <span class="meta">· ${esc(r.cas)}</span>
            ${r.motif ? `<div class="meta">« ${esc(r.motif)} »</div>` : ""}</div>
          <div class="${accord ? "meta" : "desaccord"}" style="text-align:right">
            ${esc(L[r.retenue])}
            ${accord ? "" : `<div class="meta">${esc(L.proposait)} ${esc(L[r.propose])}</div>`}
          </div></div>`;
      }).join("") +
      `<div style="margin-top:12px"><button type="button" class="b discret" id="remise">${esc(L.remise)}</button></div>`;

  brancher();
}

function brancher() {
  const L = t();
  for (const bloc of document.querySelectorAll(".dossier")) {
    const id = bloc.dataset.cas;
    const champ = bloc.querySelector(".motif-champ");
    for (const bouton of bloc.querySelectorAll("button[data-d]")) {
      bouton.onclick = () => envoyer("/api/reprendre", { cas: id, decision: bouton.dataset.d, motif: champ.value });
    }
  }
  const remise = $("#remise");
  if (remise) remise.onclick = () => {
    if (confirm(L.remiseConfirme)) envoyer("/api/reinitialiser", {});
  };
}

async function envoyer(chemin, corps) {
  if (occupe) return;
  occupe = true;
  for (const b of document.querySelectorAll("button.b")) b.disabled = true;
  try {
    const r = await api(chemin, corps);
    if (r.erreur) { alert(r.erreur); return; }
    etat = r;
    dessiner();
  } finally {
    occupe = false;
    for (const b of document.querySelectorAll("button.b")) b.disabled = false;
  }
}

for (const l of ["fr", "en"]) {
  $(`#${l}`).onclick = () => { langue = l; localStorage.setItem("langue", l); dessiner(); };
}

etat = await api("/api/etat");
dessiner();
// Le compromis complet arrive après le premier rendu : il informe, il ne bloque pas.
compromis = await api("/api/compromis");
dessiner();
</script>
</body>
</html>
