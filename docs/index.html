<p class="renvoi" style="margin-bottom:1.5rem">
This runs entirely in your browser — no server, no data leaves your machine, and the review
queue you build is yours alone. The 400 client files are <b>synthetic and seeded</b>; the
regulations each decision cites are real and linked.
<a href="https://github.com/ArslaneSempai-ui/kyc-triage-agent">Source and method</a>.
</p>

  <div id="chiffres"></div>

</main>

<script type="module">
import {
  demarrer, fileDAttente, traitees, reprendre, reglerSeuil, basculerReferentiel, chiffres,
  reinitialiser, lireCas,
} from "./js/file.js";
import { balayer, mesurer } from "./js/mesurer.js";
import { REFERENTIEL_SECTORIEL } from "./js/referentiel.js";

demarrer(400);

const etat = () => ({ chiffres: chiffres(), file: fileDAttente(), traitees: traitees() });

window.LOCAL = async (chemin, corps) => {
  if (chemin === "/api/etat") return etat();

  if (chemin === "/api/reprendre") {
    reprendre(String(corps.cas ?? ""), corps.decision, String(corps.motif ?? ""));
    return etat();
  }
  if (chemin === "/api/reinitialiser") { reinitialiser(); return etat(); }
  if (chemin === "/api/seuil") { reglerSeuil(Number(corps.seuil)); return etat(); }
  if (chemin === "/api/referentiel") { basculerReferentiel(Boolean(corps.actif)); return etat(); }

  if (chemin === "/api/compromis") {
    const cas = lireCas();
    return {
      avec: balayer(cas, undefined, REFERENTIEL_SECTORIEL),
      sans: balayer(cas, undefined, undefined),
      actuel: mesurer(cas, chiffres().seuil, chiffres().referentielActif ? REFERENTIEL_SECTORIEL : undefined),
    };
  }
  return {};
};
</script>
<script type="module">
/* L'écran a déjà sa propre fonction `brancher` — celle qui recâble les boutons après un
 * rendu. On renomme à l'import : deux déclarations du même nom au premier niveau d'un
 * module est une erreur de syntaxe, et elle emporte l'écran entier, pas seulement la figure. */
import { courbe, histogramme, brancher as brancherFigures } from "./graphes.js";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
/*
 * One screen, two hosts.
 *
 * Run locally, this talks to the Node server. Published to GitHub Pages there is no
 * server, so the same agent runs in the browser and `window.LOCAL` answers the same routes
 * with the same shapes. Keeping one file rather than two means the hosted demo cannot
 * drift from the tool — which is the only way a demo stays worth clicking.
 */
const api = async (chemin, corps) => {
  if (window.LOCAL) return window.LOCAL(chemin, corps);
  const r = await fetch(chemin, corps ? { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(corps) } : {});
  return r.json();
};

/**
 * Les valeurs du modèle, rendues lisibles.
 *
 * « particulier » et « conseil » sont des identifiants, pas de l'anglais. Les laisser
 * traverser l'écran anglais faisait passer une donnée pour un oubli de traduction.
 */
const MOTS = {
  fr: { particulier:"particulier", societe:"société",
        "conseil":"conseil", "commerce de detail":"commerce de détail",
        "restauration":"restauration", "immobilier":"immobilier",
        "crypto-actifs":"crypto-actifs", "import-export":"import-export",
        "art et antiquites":"art et antiquités",
        identite:"pièce d'identité", domicile:"justificatif de domicile",
        immatriculation:"immatriculation", structure:"structure de détention" },
  en: { particulier:"individual", societe:"company",
        "conseil":"consulting", "commerce de detail":"retail",
        "restauration":"food service", "immobilier":"real estate",
        "crypto-actifs":"crypto assets", "import-export":"import-export",
        "art et antiquites":"art and antiques",
        identite:"identity document", domicile:"proof of address",
        immatriculation:"registration", structure:"ownership structure" },
};
const mot = (cle) => MOTS[langue][cle] ?? cle;

let langue = localStorage.getItem("langue") === "fr" ? "fr" : "en";
const t = () => T[langue];

let etat = null;
let compromis = null;
let occupe = false;

const pc = (x) => (x * 100).toFixed(1) + " %";
/* Le groupement des milliers suit la langue de lecture, pas celle du modèle. */
const langNum = () => (langue === "fr" ? "fr-FR" : "en-GB");
const nb = (n) => Math.round(n).toLocaleString(langNum());
const pcCran = (x) => Math.round(x * 100) + " %";

function blocChiffres(c) {
  const L = t();
  const cases = [
    { v: pc(c.tauxAutomatisation), l: L.auto },
    { v: c.enFile, l: L.enFile },
    { v: c.escaladesInutiles, l: L.evitables },
    { v: c.manquements, l: L.manquements, alerte: c.manquements > 0 },
    { v: pc(c.precisionAutomatisee), l: L.justesse },
  ];
  // Un taux d'accord sur deux décisions n'est pas un taux, c'est du bruit. On dit
  // combien il en manque plutôt que d'afficher un chiffre qui trompe.
  cases.push(c.assezDeReprises
    ? { v: pc(c.tauxAccord), l: L.accord }
    : { v: "—", l: L.accordAttente(c.manquePourConclure), attente: true });

  /*
   * Un compte, pas des tuiles.
   *
   * Le manquement est le total : il découle de ce qui est au-dessus de lui, et une
   * tuile posée à côté des autres ne disait pas cela.
   */
  /*
   * Le total est le manquement, pas la dernière tuile venue.
   *
   * Une première version plaçait en total « il manque 9 décisions pour conclure » : une
   * réserve, pas une conclusion. Le total doit être ce qui décide — ici le seul chiffre
   * dont le coût est réglementaire.
   */
  const accord = cases.pop();
  const manquements = cases.splice(3, 1)[0];

  $("#chiffres").innerHTML = `<section class="feuillet">
    <div class="intitule">${esc(L.releve)}</div>
    <div class="corps">
      ${cases.map((x) => `<div class="ligne">
        <span class="intitule">${esc(x.l)}</span>
        <span class="valeur">${esc(x.v)}</span></div>`).join("")}
      <div class="ligne total ${c.manquements > 0 ? "defavorable" : "favorable"}">
        <span class="intitule">${esc(manquements.l)}</span>
        <span class="valeur">${esc(manquements.v)}</span></div>
      <div class="renvoi">${esc(accord.l)}${accord.attente ? "" : ` — ${esc(accord.v)}`}</div>
    </div></section>`;
}

function blocReglages(c) {
  const L = t();

  /*
   * Les dossiers dont l'écran parle, enfin dessinés.
   *
   * Le curseur seul est une promesse : deux nombres bougent et il faut croire que quelque
   * chose s'est passé. Ici la population est là, le seuil est une ligne posée dessus, et
   * la part hachurée montre ce que le curseur ne déplacera jamais — les escalades imposées
   * par une règle certaine. C'est ce qui empêche de conclure « l'outil est cassé » en
   * tirant le curseur d'un bout à l'autre.
   */
  const figSeuil = histogramme({
    bandes: c.distribution.map((b) => ({ de: b.de, a: b.a, valeur: b.total, part: b.escalades })),
    seuil: {
      v: c.seuil,
      etiquette: L.figSeuilEtiq(c.seuil.toFixed(2)),
      avant: L.figSeuilAvant,
      apres: L.figSeuilApres,
    },
    fmt: (v) => String(Math.round(v)),
    fmtX: (v) => v.toFixed(2),
    legende: [{ texte: L.figSeuilCleSeul }, { texte: L.figSeuilClePart, trame: true }],
    hauteur: 262,
    aria: L.figSeuilAria,
  });

  $("#reglages").innerHTML = `
    <section class="feuillet"><div class="corps">
      <div class="titre">${esc(L.seuilTitre)}</div>
      <div class="quoi">${esc(L.seuilQuoi)}</div>
      <div class="rang">
        <span class="bout">${esc(L.seuilBas)}</span>
        <input type="range" id="seuil" min="0.3" max="0.99" step="0.01" value="${c.seuil}"
          aria-label="${esc(L.seuilNom)}" />
        <span class="bout">${esc(L.seuilHaut)}</span>
        <span class="lecture" id="seuilVal">${c.seuil.toFixed(2)}</span>
      </div>
      <div class="titre-fig">${esc(L.figSeuilTitre(c.total))}</div>${figSeuil}
      <div class="attribution">${L.attribution(c.parLaRegle, c.parLeSeuil)}</div>
      <div class="bascule">
        <input type="checkbox" id="ref" ${c.referentielActif ? "checked" : ""} />
        <label for="ref">${esc(L.refLabel)}</label>
      </div>
    </div></section>`;

  /* Le bloc est réécrit entièrement à chaque changement : les écouteurs partent avec. */
  brancherFigures($("#reglages"));

  const seuil = $("#seuil");
  seuil.oninput = () => { $("#seuilVal").textContent = Number(seuil.value).toFixed(2); };
  seuil.onchange = () => envoyer("/api/seuil", { seuil: Number(seuil.value) });
  $("#ref").onchange = (e) => envoyer("/api/referentiel", { actif: e.target.checked });
}

function blocCompromis(c) {
  const L = t();
  if (!compromis) { $("#compromis").innerHTML = ""; return; }
  const jeu = c.referentielActif ? compromis.avec : compromis.sans;

  const lignes = jeu.map((b) => {
    const ici = Math.abs(b.seuil - c.seuil) < 0.005;
    return `<tr class="${ici ? "ici" : ""}">
      <td>${b.seuil.toFixed(2)}</td>
      <td>${pc(b.tauxAutomatisation)}</td>
      <td>${pc(b.precisionAutomatisee)}</td>
      <td>${b.manquements}</td>
      <td>${b.escaladesInutiles}</td>
    </tr>`;
  }).join("");

  /* La zone où un dossier passe à travers : ce n'est pas un point de la courbe qu'on
   * choisirait, c'est un réglage disqualifié. Les bornes tombent à mi-chemin des seuils
   * voisins — rien n'a été mesuré entre les deux. */
  const bandes = [];
  jeu.forEach((b, i) => {
    if (!b.manquements) return;
    const de = i === 0 ? b.seuil : (jeu[i - 1].seuil + b.seuil) / 2;
    const a = i === jeu.length - 1 ? b.seuil : (b.seuil + jeu[i + 1].seuil) / 2;
    const prec = bandes[bandes.length - 1];
    if (prec && Math.abs(prec.a - de) < 1e-9) prec.a = a;
    else bandes.push({ de, a, nom: bandes.length ? "" : L.bandeManque });
  });

  const repere = { x: c.seuil, texte: L.iciRepere };
  const fmtSeuil = (v) => v.toFixed(2);

  /* Les deux séries sont des pourcentages : elles partagent l'axe, sinon l'écart entre
   * « un tiers automatisé » et « juste à 96 % » se lirait comme une comparaison. */
  const figAuto = courbe({
    points: jeu, x: (b) => b.seuil, marque: repere, bandes, fmtX: fmtSeuil,
    hauteur: 230, aria: L.figAutoAria,
    series: [
      /* Une décimale dans l'info-bulle, aucune sur l'axe : « 100.0 % » sur un cran ne dit
       * rien de plus que « 100 % » et prend la place du cran voisin. */
      { cle: (b) => b.tauxAutomatisation, nom: L.serAuto, aire: true, fmt: pc, fmtCran: pcCran },
      { cle: (b) => b.precisionAutomatisee, nom: L.serJuste, partage: true, ton: "neutre", fmt: pc, fmtCran: pcCran },
    ],
  });

  const figEscalade = courbe({
    points: jeu, x: (b) => b.seuil, marque: repere, bandes, fmtX: fmtSeuil,
    hauteur: 210, aria: L.figEscaladeAria,
    series: [{ cle: (b) => b.escaladesInutiles, nom: L.serEscalades, aire: true,
               ton: "attention", fmt: (v) => nb(v) }],
  });

  $("#compromis").innerHTML = `
    <div class="feuillet">
      <div class="quoi">${esc(L.compromisQuoi)}
        — <em>${esc(c.referentielActif ? L.avecRef : L.sansRef)}</em></div>
      <div class="titre-fig">${esc(L.figAutoTitre)}</div>${figAuto}
      <div class="titre-fig">${esc(L.figEscaladeTitre)}</div>${figEscalade}
      <details><summary>${esc(L.voirChiffres)}</summary>
      <div class="defile">
        <table >
          <thead><tr>
            <th>${esc(L.colSeuil)}</th><th>${esc(L.colAuto)}</th><th>${esc(L.colJuste)}</th>
            <th>${esc(L.colManq)}</th><th>${esc(L.colEvit)}</th>
          </tr></thead>
          <tbody>${lignes}</tbody>
        </table>
      </div></details>
    </div>`;
  brancherFigures($("#compromis"));
}

function blocRegles(regles) {
  const L = t();
  if (regles.length === 0) {
    return `<div class="regle"><div class="constat" style="color:var(--muted)">${esc(L.aucuneRegle)}</div></div>`;
  }
  return regles.map((r) => `
    <div class="ligne">
      <span class="intitule"><span class="reference">${esc(r.code)}</span> ${esc(r.constat[langue])}
        <small>${esc(r.clause[langue])}</small></span>
      <span class="valeur">${r.nettete.toFixed(2)} <small>${esc(L.nettete)}</small></span>
    </div>`).join("");
}

function dossier(l) {
  const L = t();
  const c = l.cas, v = l.verdict;
  return `
    <div class="feuillet dossier" data-cas="${esc(c.id)}">
      <div class="corps"><div class="entete">
        <div><span class="nom">${esc(c.nom)}</span>
          <span class="meta"> · ${esc(mot(c.type))} · ${esc(c.paysResidence)}</span></div>
        <div class="meta">${esc(c.id)} · ${esc(L.confiance)} ${v.confiance.toFixed(2)}</div>
      </div>
      <div class="meta">${esc(mot(c.activite.secteur))} · ${c.activite.volumeAnnuelDeclare.toLocaleString(langNum())} € ${esc(L.declares)} · ${esc(L.opere)} ${esc(c.activite.paysOperation.join(", "))}</div>

      <div class="renvoi attention">${esc(v.escalade
        ? L.sousLeSeuil(v.motifEscalade.confiance, v.motifEscalade.seuil)
        : L.parLaRegle)}</div>
      <div style="margin-top:12px">${blocRegles(v.regles)}</div>

      <div class="rang">
        <input class="champ" placeholder="${esc(L.motifChamp)}" />
        ${["approuver", "complement", "escalader"].map((d) => `
          <button type="button" class="b${d === v.decisionBrute ? " propose" : ""}" data-d="${d}"
            ${d === v.decisionBrute ? `title="${esc(L.proposeTitre)}"` : ""}>${esc(L[d])}${d === v.decisionBrute ? " ·" : ""}</button>`).join("")}
      </div>
    </div></div>`;
}

function dessiner() {
  const L = t();
  const { chiffres: c, file, traitees } = etat;

  document.documentElement.lang = langue;
  $("#h1").textContent = L.h1;
  $("#provenanceLegende").innerHTML = L.provenance;
  $("#lede").textContent = L.lede;
  $("#fr").className = langue === "fr" ? "on" : "";
  $("#en").className = langue === "en" ? "on" : "";

  blocChiffres(c);
  blocReglages(c);
  $("#titreCompromis").textContent = L.compromisTitre;
  blocCompromis(c);

  $("#titreFile").textContent = file.length < c.enFile
    ? L.filePartielle(file.length, c.enFile) : L.fileTitre(c.enFile);
  $("#file").innerHTML = file.length === 0
    ? `<div class="vide">${esc(L.fileVide)}</div>`
    : file.map(dossier).join("") + `<div class="meta" style="margin-top:10px">${esc(L.legende)}</div>`;

  $("#titreTraitees").textContent = L.traiteesTitre;
  $("#traitees").innerHTML = traitees.length === 0
    ? `<div class="vide">${esc(L.traiteesVide)}</div>`
    : traitees.map((l) => {
        const r = l.reprise;
        const accord = r.retenue === r.propose;
        return `<div class="fait">
          <div>${esc(l.cas.nom)} <span class="meta">· ${esc(r.cas)}</span>
            ${r.motif ? `<div class="meta">« ${esc(r.motif)} »</div>` : ""}</div>
          <div class="${accord ? "meta" : "desaccord"}" style="text-align:right">
            ${esc(L[r.retenue])}
            ${accord ? "" : `<div class="meta">${esc(L.proposait)} ${esc(L[r.propose])}</div>`}
          </div></div>`;
      }).join("") +
      `<div style="margin-top:12px"><button type="button" class="b remise" id="remise">${esc(L.remise)}</button></div>`;

  brancher();
}

function brancher() {
  const L = t();
  for (const bloc of document.querySelectorAll(".dossier")) {
    const id = bloc.dataset.cas;
    const champ = bloc.querySelector(".motif-champ");
    for (const bouton of bloc.querySelectorAll("button[data-d]")) {
      bouton.onclick = () => envoyer("/api/reprendre", { cas: id, decision: bouton.dataset.d, motif: champ.value });
    }
  }
  const remise = $("#remise");
  if (remise) remise.onclick = () => {
    if (confirm(L.remiseConfirme)) envoyer("/api/reinitialiser", {});
  };
}

async function envoyer(chemin, corps) {
  if (occupe) return;
  occupe = true;
  for (const b of document.querySelectorAll("button.b")) b.disabled = true;
  try {
    const r = await api(chemin, corps);
    if (r.erreur) { alert(r.erreur); return; }
    etat = r;
    dessiner();
  } finally {
    occupe = false;
    for (const b of document.querySelectorAll("button.b")) b.disabled = false;
  }
}

for (const l of ["fr", "en"]) {
  $(`#${l}`).onclick = () => { langue = l; localStorage.setItem("langue", l); dessiner(); };
}

etat = await api("/api/etat");
dessiner();
// Le compromis complet arrive après le premier rendu : il informe, il ne bloque pas.
compromis = await api("/api/compromis");
dessiner();
</script>
</body>
</html>
